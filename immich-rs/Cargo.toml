[package]
name = "immich-rs"
edition.workspace = true
version.workspace = true

authors.workspace = true
description = "Async, type-safe Rust SDK for the Immich self-hosted photo and video management platform."

license.workspace = true
readme = "../README.md"
documentation = "https://docs.rs/immich-rs"
homepage = "https://github.com/boul2gom/immich-rs"
repository = "https://github.com/boul2gom/immich-rs"

categories = ["api-bindings", "asynchronous", "web-programming::http-client", "multimedia", "wasm"]
keywords = ["immich", "photo", "video", "sdk", "async"]

publish.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin", "wasm32-unknown-unknown"]

[package.metadata.release]
tag-name = "v{{version}}"
tag-message = "🔖 v{{version}}"
pre-release-commit-message = "🔖 v{{version}}"
pre-release-replacements = [
  {file="../README.md", search='immich-rs = "[\d.]+"', replace='immich-rs = "{{version}}"', min=1},
  {file="../README.md", search='(immich-rs = \{ version = )"[\d.]+"', replace='$1"{{version}}"', min=1},
]

[features]
default = ["fs", "rustls-tls"]
fs = ["dep:tokio-util"]
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/default-tls"]
socketio = ["dep:rust_socketio"]
opentelemetry = ["dep:opentelemetry"]
cli-config = ["dep:toml", "dep:serde-saphyr"]
test-util = []

[dependencies]
# Workspace crates
immich-models.workspace = true

# Runtime and async (cross-platform)
tokio = { workspace = true, features = ["sync", "io-util"] }
reqwest = { workspace = true, features = ["json", "multipart", "stream"] }
tower-service.workspace = true
tower-layer.workspace = true
futures-core.workspace = true
futures-util.workspace = true
async-stream.workspace = true
arc-swap.workspace = true
bytes.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
uuid.workspace = true
chrono.workspace = true

# Error handling
thiserror.workspace = true

# Observability
tracing.workspace = true
opentelemetry = { workspace = true, optional = true }

# Networking, URLs and HTTP headers
url.workspace = true
mime_guess.workspace = true
httpdate.workspace = true

# Hashing and Crypto
sha1.workspace = true
hex.workspace = true

# Utilities
rand.workspace = true
scopeguard.workspace = true

# CLI Configuration parsers (optional)
toml = { workspace = true, optional = true }
serde-saphyr = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt", "time", "fs"] }
tokio-util = { workspace = true, features = ["io"], optional = true }
rust_socketio = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
wasm-bindgen-futures.workspace = true
web-time.workspace = true
gloo-timers.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "test-util"] }
testcontainers.workspace = true
wiremock.workspace = true
tempfile.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true

[dev-dependencies]
http.workspace = true
uuid = { workspace = true, features = ["v4"] }
tracing-subscriber.workspace = true
anyhow.workspace = true
pretty_assertions.workspace = true

[lints]
workspace = true

[[example]]
name = "ping_server"

[[example]]
name = "list_albums"

[[example]]
name = "paginate_people"

[[example]]
name = "upload_asset"
required-features = ["fs"]

[[example]]
name = "bulk_upload"
required-features = ["fs"]

[[example]]
name = "cleanup_duplicates"

[[example]]
name = "export_album"
required-features = ["fs"]

[[example]]
name = "live_events"
required-features = ["socketio"]

[[example]]
name = "server_stats"

