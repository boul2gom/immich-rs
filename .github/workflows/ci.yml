name: "🔌 Github CI - Development"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-spell:
    name: 📝 Check spelling
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📝 Check spelling
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  check-format:
    name: 💄 Check formatting
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🛠️ Set up nightly Rust (for rustfmt)
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # nightly
        with:
          toolchain: nightly
          components: rustfmt

      - name: 💄 Check formatting
        run: cargo +nightly fmt --all -- --check

  dependency-review:
    name: 📦 Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  build-and-test:
    name: 🦀 Build & Test
    runs-on: ubuntu-latest
    needs: [check-spell]
    env:
      CLICOLOR: 1
    permissions:
      contents: read

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "immich-rs"

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy

      - name: 🦀 Check with Clippy (all targets, examples & features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: 📦 Build test & example targets
        run: cargo test --no-run --workspace --all-features

      - name: 🧪 Run workspace tests
        run: cargo test --workspace --all-features
        env:
          RUST_LOG: info

  targets-and-backends:
    name: 🌐 Targets, Feature Matrix & MSRV
    runs-on: ubuntu-latest
    needs: [check-spell]
    env:
      CLICOLOR: 1
    permissions:
      contents: read

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "immich-rs-targets"

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: 🌐 WASM target check (default, minimal & all-features)
        run: |
          cargo check -p immich-models -p immich-rs --target wasm32-unknown-unknown
          cargo check -p immich-models -p immich-rs --target wasm32-unknown-unknown --no-default-features
          cargo check -p immich-models -p immich-rs --target wasm32-unknown-unknown --all-features

      - name: 🦀 TLS backend check (native-tls)
        run: cargo check -p immich-rs --no-default-features --features native-tls

      - name: 🛠️ Install cargo-hack
        uses: taiki-e/install-action@7fa572463ed6f88f64fd37a4f8ca146df751432d # cargo-hack
        with:
          tool: cargo-hack

      - name: 🧩 Check feature powerset
        run: cargo hack check --feature-powerset -p immich-rs

      - name: 🛠️ Set up MSRV toolchain (1.88)
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # 1.88
        with:
          toolchain: "1.88"

      - name: 📌 MSRV compatibility check
        run: cargo +1.88 check --workspace --all-features

  doc-tests:
    name: 📚 Test & Build Docs
    needs: [check-spell]
    runs-on: ubuntu-latest
    env:
      CLICOLOR: 1
    permissions:
      contents: read

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "immich-rs"

      - name: 🛠️ Set up stable & nightly Rust toolchains
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: 🛠️ Set up nightly Rust (for docsrs doc_cfg check)
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # nightly
        with:
          toolchain: nightly

      - name: 📚 Run doc tests
        run: cargo test --doc --workspace --all-features

      - name: 📖 Build Rustdoc with strict link checking
        run: cargo +nightly doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings --cfg docsrs"

  analysis:
    name: 🔍 Static analysis
    needs: [build-and-test]
    runs-on: ubuntu-latest
    env:
      CLICOLOR: 1
    permissions:
      contents: read

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🛠️ Install cargo-deny
        uses: taiki-e/install-action@7fa572463ed6f88f64fd37a4f8ca146df751432d # cargo-deny

      - name: 🔐 Security, License and Dependency Audit
        run: cargo deny check

      - name: 🛠️ Install cargo-machete
        uses: taiki-e/install-action@6929d36b9cc9bd3c8a031f179ec7f72cffbfc6fa # cargo-machete

      - name: 🧹 Unused dependencies
        run: cargo machete

  e2e:
    name: 🚀 E2E Seeded Demo Instance (Docker)
    runs-on: ubuntu-latest
    needs: [build-and-test, doc-tests]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e')
    env:
      CLICOLOR: 1
    permissions:
      contents: read

    steps:
      - name: 📁 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "immich-rs"

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: 🔐 Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 🐳 Pull Immich Docker images with retry
        run: |
          images=(
            "valkey/valkey:8.0-alpine"
            "ghcr.io/immich-app/postgres:18-vectorchord1.1.1"
            "ghcr.io/immich-app/immich-server:release"
          )
          for img in "${images[@]}"; do
            echo "::group::Pulling $img"
            for attempt in {1..3}; do
              if docker pull "$img"; then
                break
              fi
              echo "Pull failed on attempt $attempt, retrying in 5s..."
              sleep 5
            done
            echo "::endgroup::"
          done

      - name: 🚀 Run E2E Seeded Demo Workflow Tests
        run: cargo test -p immich-rs --test e2e_workflow_tests -- --ignored --nocapture
        env:
          RUST_LOG: info
          TESTCONTAINERS_RYUK_DISABLED: "true"
