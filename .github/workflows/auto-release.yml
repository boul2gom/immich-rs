name: "📦 Github CI - Automatic weekly release"

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release all packages even without detected unreleased commits'
        required: false
        type: boolean
        default: false
      force_major:
        description: 'Force a major version bump for the chosen crate (patch/minor are otherwise determined by semver-checks)'
        required: false
        type: choice
        options:
          - none
          - all
          - immich-rs
          - immich-models
        default: 'none'

jobs:
  check_updates:
    name: ✅ Check update commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      one_has:            ${{ steps.check_commits.outputs.one_has == 'true' || steps.check_models_published.outputs.needs_publish == 'true' }}
      has_updates:        ${{ steps.check_commits.outputs.main_has }}
      has_models_updates: ${{ steps.check_models_published.outputs.needs_publish == 'true' || fromJSON(steps.check_commits.outputs.sub_results)['immich-models'] }}

    steps:
      - name: 🛡️ Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: 🔍 Check if immich-models is published on crates.io
        id: check_models_published
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: ci" https://crates.io/api/v1/crates/immich-models)
          if [ "$STATUS" = "404" ]; then
            echo "needs_publish=true" >> $GITHUB_OUTPUT
          else
            echo "needs_publish=false" >> $GITHUB_OUTPUT
          fi

      - name: ✅ Check unreleased commits
        id: check_commits
        uses: boul2gom/actions/unreleased-commits@aa85616fe98fc3a942de07be9d1b1fb57bbd2bdc # v1.0.12
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          force_release: ${{ inputs.force_release || false }}
          exclude_patterns: "[Github Actions],[skip ci]"
          sub_projects: |
            immich-models:immich-models/

  check_status:
    name: ✅ Check Github CI - Development status
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      ci_success: ${{ steps.check_ci.outputs.ci_success }}

    steps:
      - name: 🛡️ Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: ✅ Check CI status
        id: check_ci
        uses: boul2gom/actions/ci-status@aa85616fe98fc3a942de07be9d1b1fb57bbd2bdc # v1.0.12
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          workflow_id: ci.yml
          branch: main

  semver_gate:
    name: 🔖 Semver compatibility gate
    needs: [check_updates, check_status]
    if: ${{ needs.check_status.outputs.ci_success == 'true' && needs.check_updates.outputs.one_has == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      resolved_type: ${{ steps.resolve.outputs.resolved_type }}
      resolved_models_type: ${{ steps.resolve_models.outputs.resolved_type }}

    steps:
      - name: 🛡️ Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: 📁 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Cache Rust toolchain
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: rust-semver-

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: 🚀 Check Semver compatibility (immich-rs)
        id: semver
        continue-on-error: true
        if: ${{ needs.check_updates.outputs.has_updates == 'true' }}
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: immich-rs
          feature-group: all-features

      - name: 🚀 Check Semver compatibility (immich-models)
        id: semver_models
        continue-on-error: true
        if: ${{ needs.check_updates.outputs.has_models_updates == 'true' }}
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: immich-models
          feature-group: default-features

      - name: 🔍 Resolve release type (immich-rs)
        id: resolve
        if: ${{ needs.check_updates.outputs.has_updates == 'true' }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: ci" https://crates.io/api/v1/crates/immich-rs)
          if [ "$STATUS" = "404" ]; then
            echo "📦 immich-rs not yet on crates.io — initial release at current version"
            echo "resolved_type=" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.force_major }}" == "immich-rs" || "${{ github.event.inputs.force_major }}" == "all" ]]; then
            echo "📌 Forced major release for immich-rs"
            echo "resolved_type=major" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.semver.outcome }}" == "success" ]]; then
            echo "✅ No breaking changes detected — releasing as patch"
            echo "resolved_type=patch" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Breaking changes detected — releasing as minor"
            echo "resolved_type=minor" >> $GITHUB_OUTPUT
          fi

      - name: 🔍 Resolve release type (immich-models)
        id: resolve_models
        if: ${{ needs.check_updates.outputs.has_models_updates == 'true' }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "User-Agent: ci" https://crates.io/api/v1/crates/immich-models)
          if [ "$STATUS" = "404" ]; then
            echo "📦 immich-models not yet on crates.io — initial release at current version"
            echo "resolved_type=" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.inputs.force_major }}" == "immich-models" || "${{ github.event.inputs.force_major }}" == "all" ]]; then
            echo "📌 Forced major release for immich-models"
            echo "resolved_type=major" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.semver_models.outcome }}" == "success" ]]; then
            echo "✅ No breaking changes detected — releasing immich-models as patch"
            echo "resolved_type=patch" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Breaking changes detected — releasing immich-models as minor"
            echo "resolved_type=minor" >> $GITHUB_OUTPUT
          fi

  create_release:
    name: 🔖 Create a new release
    needs: [check_updates, check_status, semver_gate]
    if: ${{ needs.check_status.outputs.ci_success == 'true' && needs.check_updates.outputs.one_has == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: 🛡️ Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: 🔐 Generate ephemeral token from GitHub App
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}

      - name: 📁 Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: 📦 Cache Rust toolchain
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: rust-toolchain-

      - name: 🛠️ Set up Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: 📌 Install cargo-release
        uses: taiki-e/install-action@7fa572463ed6f88f64fd37a4f8ca146df751432d # cargo-release
        with:
          tool: cargo-release

      - name: 🔐 Import GPG Key and setup Git
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          trust_level: 5
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_config_global: true
          git_committer_name: "boul2gom-bot"
          git_committer_email: "actions-bot@boul2gom.com"

      - name: 📦 Update Cargo.lock dependencies
        run: cargo update

      - name: 🤖 Commit updated Cargo.lock
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "🔒 Update Cargo.lock dependencies [skip ci]"
          commit_user_name: "boul2gom-bot"
          commit_user_email: "actions-bot@boul2gom.com"
          commit_author: "boul2gom-bot <actions-bot@boul2gom.com>"
          file_pattern: "Cargo.lock"

      - name: 🚀 Publish immich-models to crates.io
        if: ${{ needs.check_updates.outputs.has_models_updates == 'true' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo release -p immich-models ${{ needs.semver_gate.outputs.resolved_models_type }} --execute --no-confirm

      - name: ⏳ Wait for crates.io index propagation
        if: ${{ needs.check_updates.outputs.has_models_updates == 'true' && needs.check_updates.outputs.has_updates == 'true' }}
        run: |
          MODELS_VER=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "immich-models") | .version')
          echo "Waiting for immich-models $MODELS_VER to appear on crates.io..."
          for i in {1..30}; do
            if curl -sf -H "User-Agent: ci" "https://crates.io/api/v1/crates/immich-models/$MODELS_VER" > /dev/null; then
              echo "✅ immich-models $MODELS_VER is now available on crates.io!"
              sleep 10
              exit 0
            fi
            echo "Waiting for crates.io index propagation ($i/30)..."
            sleep 5
          done
          echo "⚠️ Timeout waiting for crates.io index, proceeding anyway..."

      - name: 🚀 Publish immich-rs to crates.io
        if: ${{ needs.check_updates.outputs.has_updates == 'true' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo release -p immich-rs ${{ needs.semver_gate.outputs.resolved_type }} --execute --no-confirm

      - name: 🔍 Get new version
        if: ${{ needs.check_updates.outputs.has_updates == 'true' }}
        id: get_version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "immich-rs") | .version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 📝 Generate release notes
        if: ${{ needs.check_updates.outputs.has_updates == 'true' }}
        id: generate_release_notes
        uses: boul2gom/actions/release-notes@aa85616fe98fc3a942de07be9d1b1fb57bbd2bdc # v1.0.12
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ steps.get_version.outputs.version }}
          sub_projects: |
            immich-models:immich-models/

      - name: 📝 Create GitHub Release
        if: ${{ needs.check_updates.outputs.has_updates == 'true' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: v${{ steps.get_version.outputs.version }}
          name: 🔖 v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          body: ${{ steps.generate_release_notes.outputs.release_notes }}
